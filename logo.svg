<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07C160"/>
      <stop offset="100%" style="stop-color:#04914A"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="240" stroke="white" stroke-width="1.5" fill="none" opacity="0.15"/>

  <!-- Voice bars (left) -->
  <rect x="87" y="238" width="8" height="35" rx="4" fill="white" opacity="0.5"/>
  <rect x="71" y="222" width="8" height="68" rx="4" fill="white" opacity="0.7"/>
  <rect x="55" y="211" width="8" height="90" rx="4" fill="white" opacity="0.9"/>

  <!-- Voice bars (right) -->
  <rect x="417" y="238" width="8" height="35" rx="4" fill="white" opacity="0.5"/>
  <rect x="433" y="222" width="8" height="68" rx="4" fill="white" opacity="0.7"/>
  <rect x="449" y="211" width="8" height="90" rx="4" fill="white" opacity="0.9"/>

  <!-- K letterform -->
  <path d="M 135 145 L 135 367" stroke="white" stroke-width="18" stroke-linecap="butt" opacity="0.95"/>
  <path d="M 235 145 L 135 256" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
  <path d="M 235 367 L 135 256" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

  <!-- i (dot) -->
  <circle cx="256" cy="170" r="12" fill="white" opacity="0.9"/>

  <!-- i (stem) -->
  <rect x="250" y="210" width="14" height="157" rx="7" fill="white" opacity="0.9"/>

  <!-- V letterform -->
  <path d="M 285 145 L 340 360" stroke="white" stroke-width="18" stroke-linecap="butt" opacity="0.85"/>
  <path d="M 395 145 L 340 360" stroke="white" stroke-width="18" stroke-linecap="butt" opacity="0.85"/>
</svg>
